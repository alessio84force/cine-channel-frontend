<svg viewBox="0 0 1600 260" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="display:block;overflow:visible">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#f7e8a2"/>
      <stop offset="35%" stop-color="#e6c769"/>
      <stop offset="60%" stop-color="#d4af37"/>
      <stop offset="85%" stop-color="#b8892b"/>
      <stop offset="100%" stop-color="#8f6a1f"/>
    </linearGradient>
    <filter id="wmShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feOffset dy="2" result="off"/>
      <feMerge>
        <feMergeNode in="off"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- stella sinistra -->
  <g filter="url(#wmShadow)">
    <path fill="url(#gold)"
      d="M95 20 L112 78 L172 78 L124 110 L140 168 L95 132 L50 168 L66 110 L18 78 L78 78 Z"/>
    <path fill="white" fill-opacity="0.25"
      d="M95 20 L112 78 L95 72 Z"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(200, 38)" filter="url(#wmShadow)">
    <!-- usa linee pulite con piccoli incavi per un look 'cinema' -->
    <text x="0" y="70" font-size="96" font-weight="700" letter-spacing="6" fill="url(#gold)" font-family="Georgia, 'Times New Roman', serif">CINE</text>
    <rect x="385" y="32" width="12" height="72" fill="url(#gold)"/>
    <text x="420" y="70" font-size="96" font-weight="700" letter-spacing="6" fill="url(#gold)" font-family="Georgia, 'Times New Roman', serif">CHANNEL</text>
  </g>
</svg>
